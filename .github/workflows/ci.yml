name: CI

# CD note: Render auto-deploys on push to `main` via render.yml. This pipeline
# intentionally does NOT deploy or push images — it only lints, tests, and
# proves the container builds, gating changes before Render picks them up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Tests mock the LLM providers, but config reads these keys at import time.
    # Dummy values keep CI offline without weakening the tests.
    env:
      OPENAI_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      # Install uv, pinned to a major version, with dependency caching (keyed
      # on uv.lock) so repeat runs are fast.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Provision the Python version pinned in .python-version (3.11).
      - name: Set up Python
        run: uv python install

      # Reproducible install from the lockfile (includes the dev group: ruff,
      # pytest, pytest-cov). --frozen fails if the lock is out of sync.
      - name: Install dependencies
        run: uv sync --frozen

      # Lint + format gate.
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

      # Run the suite with coverage; fail the build below 90% (currently 100%,
      # so there is headroom before a regression trips the gate).
      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test # only build the image after lint + tests pass
    steps:
      - uses: actions/checkout@v4

      # Prove the container still builds. We do NOT push it anywhere and add no
      # deploy secrets — Render builds and deploys its own image on push to main
      # (see render.yml), so building here is enough for CI.
      - name: Build image
        run: docker build -t langgraph-api:ci .
